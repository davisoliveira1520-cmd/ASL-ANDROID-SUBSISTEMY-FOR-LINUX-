# ASLM — configuração de exemplo
# Copie para ~/.config/aslm/aslm.conf (Termux) e ajuste.

# Distribuição padrão usada pelo ASLM.
# Opções: archlinux | manjaro | ubuntu | debian | fedora | rocky | alma |
#         alpine | void | opensuse | bazzite
ASLM_DISTRO="archlinux"

# Display X11 usado pela camada de jogos
ASLM_DISPLAY=":0"

# Habilitar box64 em ARM64 (1 = sim)
ASLM_BOX64_ENABLE="1"

# URL do upstream do kernel Arch (referência/documentação)
ASLM_KERNEL_UPSTREAM="https://github.com/archlinux/linux"
