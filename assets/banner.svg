<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="ASLM — Android Subsystem for Linux and Mac OS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="258" rx="15" fill="none" stroke="#30363d"/>

  <circle cx="40" cy="36" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="36" r="6" fill="#ffbd2e"/>
  <circle cx="84" cy="36" r="6" fill="#27c93f"/>

  <text x="40" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="76" font-weight="700" fill="url(#accent)">ASLM</text>
  <text x="40" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="20" fill="#c9d1d9">Android Subsystem for Linux and Mac OS</text>
  <text x="40" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16" fill="#8b949e">Arch · Ubuntu · Debian · Fedora · Alpine  —  Linux on Android</text>

  <g transform="translate(40,222)">
    <rect x="0" y="0" width="150" height="26" rx="13" fill="#1f6feb" opacity="0.18" stroke="#1f6feb"/>
    <text x="75" y="17" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
          font-size="13" fill="#79c0ff">no root</text>

    <rect x="162" y="0" width="210" height="26" rx="13" fill="#3fb950" opacity="0.18" stroke="#3fb950"/>
    <text x="267" y="17" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
          font-size="13" fill="#56d364">no dual boot</text>

    <rect x="384" y="0" width="190" height="26" rx="13" fill="#a371f7" opacity="0.18" stroke="#a371f7"/>
    <text x="479" y="17" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
          font-size="13" fill="#d2a8ff">userspace proot</text>
  </g>

  <text x="960" y="150" text-anchor="end" font-family="ui-monospace, Consolas, monospace"
        font-size="130" font-weight="700" fill="#21262d">&gt;_</text>
</svg>
